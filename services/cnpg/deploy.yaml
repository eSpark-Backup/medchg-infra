apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: dbserver
  namespace: dev-cnpg  
spec:
  instances: 1
  startDelay: 300
  stopDelay: 300
  primaryUpdateStrategy: unsupervised  
  imageName: ghcr.io/cloudnative-pg/postgresql:17.0

  enableSuperuserAccess: true
  superuserSecret:
    name: superuser


  postgresql:
    parameters:
      shared_buffers: 256MB
      pg_stat_statements.max: '10000'
      pg_stat_statements.track: all
      auto_explain.log_min_duration: '10s'
    pg_hba:
      - host all all 10.244.0.0/16 md5


  bootstrap:
    initdb:
      database: app
      owner: admin
      secret:
        name: admin
        
  # Backup properties
  backup:
    barmanObjectStore:
      destinationPath: "s3://k8s-backup-231224/dbbackup"
      s3Credentials:
        accessKeyId:
          name: aws-s3-credentials
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: aws-s3-credentials
          key: AWS_SECRET_ACCESS_KEY
      wal:
        compression: gzip      
        
  resources:
    requests:
      memory: "512Mi"
      cpu: "1"
    limits:
      memory: "1Gi"
      cpu: "2"
  storage:
    pvcTemplate:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
      storageClassName: standard
      volumeMode: Filesystem
    size: 5Gi 