apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: cnpg-pgadmin  
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      containers:
        - name: pgadmin
          image: dpage/pgadmin4
          ports:
            - containerPort: 80
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              value: admin@example.com
            - name: PGADMIN_DEFAULT_PASSWORD
              value: admin1234
---
apiVersion: v1
kind: Service
metadata:
  name: pgadmin
  namespace: cnpg-pgadmin  
spec:
  selector:
    app: pgadmin
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pgadmin
  namespace: cnpg-pgadmin    
spec:
  ingressClassName: "nginx"
  tls:
  - hosts:
    - dfwcriticalcare.medchg.com # your domain 
    - www.dfwcriticalcare.medchg.com # your domain 
    secretName: letsencrypt-prod
  rules: 
  - host: www.dfwcriticalcare.medchg.com
  - http:
      paths:
      - path: /
        pathType: ImplementationSpecific
        backend:
          service:
            name: pgadmin
            port:
              number: 80        
   