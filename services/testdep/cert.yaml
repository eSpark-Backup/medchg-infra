apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: myapp-cert
  namespace: test  
spec:
  secretName: myapp-tls
  renewBefore: 240h
  duration: 2160h
  commonName: dfwcriticalcare.medchg.com
  dnsNames:
  - dfwcriticalcare.medchg.com
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer