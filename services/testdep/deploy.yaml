apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  labels:
    app: myapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: myapp
        image: crccheck/hello-world
        ports:
        - containerPort: 8000
          name: myapp-port        
---
apiVersion: v1
kind: Service
metadata:
  name: myapp
spec:
  selector:
    app: myapp
  ports:
    - protocol: TCP
      port: 8000
      targetPort: myapp-port
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myapp
spec:
  ingressClassName: "nginx"
  tls:
  - hosts:
    - dfwcriticalcare.medchg.com # your domain 
    - www.dfwcriticalcare.medchg.com # your domain 
    secretName: letsencrypt-test
  rules: 
  - host: www.dfwcriticalcare.medchg.com
  - http:
      paths:
      - path: /
        pathType: ImplementationSpecific
        backend:
          service:
            name: myapp
            port:
              number: 8000        
   