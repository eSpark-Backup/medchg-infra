apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: test  
  labels:
    app: myapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: myapp
        image: 839119967592.dkr.ecr.us-east-1.amazonaws.com/k8s-services:latest
        ports:
        - containerPort: 8000
          name: myapp-port  
      imagePullSecrets:
      - name: regcred          
---
apiVersion: v1
kind: Service
metadata:
  name: myapp
  namespace: test    
spec:
  selector:
    app: myapp
  ports:
    - protocol: TCP
      port: 8000
      targetPort: myapp-port
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myapp
  namespace: test 
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"  
spec:
  ingressClassName: "nginx"
  tls:
  - hosts:
    - dfwcriticalcare.medchg.com # your domain 
    - www.dfwcriticalcare.medchg.com # your domain 
    secretName: myapp-tls
  rules: 
  - host: www.dfwcriticalcare.medchg.com
  - http:
      paths:
      - path: /
        pathType: ImplementationSpecific
        backend:
          service:
            name: myapp
            port:
              number: 8000        
   